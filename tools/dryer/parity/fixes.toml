# Differences between the Python original and the Rust port (DR-PB-3).
#
# Each entry is a [[fix]] table with these keys:
#   id                    short unique name, also named by its test (DR-PB-4, AC-9)
#   requirement           the DR-* requirement that asks for the difference
#   fixture               name of the [[case]] in coverage.toml that shows the difference,
#                         or an inline test project when no case can show it (DR-PB-3)
#   upstream              the upstream issue or pull request, or a description
#   original_behavior     what the original does, quoted from its output
#   changed_behavior      what the port does instead, and why
#   test                  the test that fails on the original and passes on the port
#   approved_by           "Mads Madsen". Set only by Mads Madsen (DR-PB-6). An entry
#                         without this key is not approved.
# The runner reports a difference in a case with an approved entry as ACCEPTED.
# With an entry that is not approved, it reports the difference as PENDING.

[[fix]]
id = "js-read-as-typescript"
requirement = "DR-14"
fixture = "jsx-fix"
upstream = "https://github.com/unclebob/dryer/issues/17 and https://github.com/unclebob/dryer/pull/16"
original_behavior = "On a project with only .jsx files, the original prints No source files to analyze. and writes no snapshot."
changed_behavior = "The port reads .js, .jsx, .mjs, and .cjs as language typescript with the JavaScript grammar, and skips .test.* and .spec.* files of these extensions."
test = "tests/cli.rs::dr14_jsx_only_project_reports_the_pair"

[[fix]]
id = "help-long-names-javascript"
requirement = "DR-14"
fixture = "help-long"
upstream = "https://github.com/unclebob/dryer/issues/17 and https://github.com/unclebob/dryer/pull/16"
original_behavior = "The help text of the original lists the languages Clojure, Java, Go, TypeScript, Rust, and Python and does not name JavaScript or the extensions .js .jsx .mjs .cjs."
changed_behavior = "The help text of the port also names JavaScript and lists .js .jsx .mjs .cjs, because the port reads these files (DR-14)."
test = "tests/cli.rs::dr14_help_names_javascript"

[[fix]]
id = "help-short-names-javascript"
requirement = "DR-14"
fixture = "help-short"
upstream = "https://github.com/unclebob/dryer/issues/17 and https://github.com/unclebob/dryer/pull/16"
original_behavior = "The help text of the original lists the languages Clojure, Java, Go, TypeScript, Rust, and Python and does not name JavaScript or the extensions .js .jsx .mjs .cjs."
changed_behavior = "The help text of the port also names JavaScript and lists .js .jsx .mjs .cjs, because the port reads these files (DR-14)."
test = "tests/cli.rs::dr14_help_names_javascript"

[[fix]]
id = "rust-test-code-left-out"
requirement = "DR-15"
fixture = "rust-test-code-fix"
upstream = "none: there is no upstream issue or pull request. The original skips a Rust function only when an enclosing mod is named tests."
original_behavior = "In a Rust file, the original compares the functions of a #[cfg(test)] mod that is not named tests, a function with #[test], and a function with #[cfg(test)]. On this fixture, with --threshold 0.6, it prints DUPLICATE score=0.64 for src/invoice.rs:9-14 and src/receipt.rs:4-10."
changed_behavior = "The port treats a Rust function as test code and leaves it out when an enclosing mod is named tests, an enclosing mod has #[cfg(test)], the function has #[test], or the function has #[cfg(test)] (DR-15). On this fixture it prints No duplicate candidates found."
test = "tests/cli.rs::dr15_cfg_test_module_functions_are_not_compared"

[[fix]]
id = "unreadable-file-warns-and-continues"
requirement = "DR-16"
fixture = "tests/cli.rs::dr16_unreadable_file_warns_and_the_scan_goes_on (project built inline: a.py, b.py, and one broken symlink locked.py in the project root). No parity case shows this difference, because the runner stops on a case whose original prints a traceback."
upstream = "none: there is no upstream issue or pull request. The original calls path.read_text with no handler, so it stops with a Python traceback."
original_behavior = "When a selected source file cannot be read, the original stops with exit code 1 and writes no report. Run on the inline project, stderr ends with FileNotFoundError: [Errno 2] No such file or directory: '/nonexistent/target.py' and stdout is empty."
changed_behavior = "The port prints a warning on standard error with the file name and the reason, skips that file, and goes on with the other files (DR-16). It exits 0 and the snapshot covers the files that it could read."
test = "tests/cli.rs::dr16_unreadable_file_warns_and_the_scan_goes_on"

[[fix]]
id = "worker-thread-exit-70"
requirement = "DR-13"
fixture = "src/cli.rs::dr13_thread_start_failure_reports_error_and_exits_seventy (no inline project: the difference is the worker thread of the port, which the original does not have). No parity case shows this difference, because the original has no worker thread and never exits 70."
upstream = "none: there is no upstream issue or pull request. The original runs the scan on its main thread, so it has no thread that can fail to start or panic."
original_behavior = "The original has no worker thread. It never exits 70. A run that the interpreter cannot start fails before the program runs, and a failure inside the scan stops with a Python traceback and exit code 1."
changed_behavior = "The port runs the scan on a worker thread with a large stack. When that thread does not start, the port prints the reason on standard error and exits 70. When the thread panics, the port exits 70 with no message (DR-13)."
test = "src/cli.rs::dr13_thread_start_failure_reports_error_and_exits_seventy"
