# Parity cases. Each case copies fixtures/<fixture>/ into a fresh temp directory,
# once for the original and once for the port. The runner prepends
# `--root <copy>` to `args` and runs with cwd set to the copy.
#
# git_setup = "changed" commits the fixture, then appends a comment to the first
# two sorted source files (the second is staged), and adds an untracked copy of
# the first file named changed_new.<ext>. --changed then has a known selection.
#
# covers names the README "What each language compares" row, or the flag or
# behavior, that the case exercises. Left-out names are the README exclusions.
#
# Threshold fixture (fixtures/threshold): the pair scores 0.88 with the original.
# The default run (0.82) reports it, --threshold 0.8 reports it, and
# --threshold 0.9 reports nothing.

[[case]]
name = "default-clojure"
fixture = "clojure"
args = []
covers = [
  "row:clojure:candidate",
  "row:clojure:ns-excluded",
  "row:clojure:reader-conditional-left-out",
  "row:clojure:syntax-quote",
  "row:clojure:keyword-call",
]

[[case]]
name = "default-java"
fixture = "java"
