# MU-PB-3: every difference from the original. MU-PB-6: Mads Madsen approves each entry.
# Each entry names a test (MU-PB-4, AC-12) in `tools/mutator/tests/`.
# A difference that no parity run can show names that test file as its `fixture`, with a
# note in brackets when the test builds its project inline. `tests/fixes_toml.rs` checks
# that the file exists and holds the named fn.

[[fix]]
id = "second-run-near-timeout"
requirement = "MU-21"
description = """The original kills a mutant as soon as its first run times out. Under load, a
survivor can then count as killed. The port runs a mutant a second time with 2 times the timeout
when the first run timed out or took at least 90% of the timeout, and uses the second result."""
changed_behavior = "A mutant that times out once, or runs within 10% of its timeout, gets one more run with 2x timeout."
fixture = "tests/mu21_second_run.rs (project built inline)"
test = "tests/mu21_second_run.rs::mu_21_second_run_decides_the_outcome"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "idempotent-tested-at"
requirement = "MU-NFR-1"
description = """The original writes a new `:tested-at` time on every run, so two runs on the same
files give snapshots that differ in one line (PRD AC-13 asks for byte-identical snapshots). The port
keeps the old file when the new content equals it apart from `:tested-at`."""
changed_behavior = "`:tested-at` changes only when another value in the snapshot changes."
fixture = "tests/mu21_second_run.rs (project built inline)"
test = "tests/mu21_second_run.rs::mu_nfr_1_five_runs_give_identical_snapshots"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "worker-cap-half-the-cores"
requirement = "MU-17"
description = """The original runs one mutant per core by default and its help text says `one per
core`. The port uses half the cores, at least one, so mutants do not starve the test commands they
start (`worker_count` and `cap_for` in `src/workers.rs`). Half the cores is a hard cap: no run uses
more workers than that, also when `--max-workers` asks for more, so `--max-workers 10000` on an
8-core host gives 4 workers. The help text of `--max-workers` and the long text say so. The test is
`tests/worker_cap.rs`."""
changed_behavior = "The worker count is the smaller of the sites, half the cores (at least 1), and an explicit --max-workers, so --max-workers cannot raise it above half the cores, and `--help` says so instead of `one per core`."
fixture = "tests/worker_cap.rs (no fixture project; the test calls workers::worker_count and runs --help)"
test = "tests/worker_cap.rs::mu_17_default_worker_count_is_half_the_cores_at_least_one"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "ts-dot-imports-are-relative"
requirement = "MU-22"
description = """The original finds the test files that import the mutated module with a pattern that
needs one character after the dot. The specifiers `'.'` and `'..'` (the `index` file of a directory)
never match, so such a test stays a symlink, Node loads the original file, and a killed mutant is
reported as SURVIVED (upstream issue 29). The port matches a lone dot, resolves it to `index.<ext>`,
and copies the test file into the worker."""
changed_behavior = "A TypeScript or JavaScript test that imports its module from '.' or '..' runs against the mutant."
fixture = "tests/upstream_fixes.rs (project built inline: src/calc/index.ts and src/calc/index.test.ts)"
test = "tests/upstream_fixes.rs::mu_22_ac14_a_test_that_imports_dot_is_copied_so_the_mutant_is_killed"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "python-more-operators"
requirement = "MU-23"
description = """The original makes no site for the Python operators `is`, `is not`, `in`, `not in`,
`//`, `%`, `**`, `@`, `+=`, `-=`, `*=`, and `/=` (upstream issue 10). The port makes these mutants:
`is` <-> `is not`, `in` <-> `not in`, `//` <-> `/`, `%` to `*`, `**` to `*`, `@` to `*`,
`+=` <-> `-=`, and `*=` <-> `/=`. Python `/` keeps its mutant `*` and gains `//`."""
changed_behavior = "A Python file with these operators has more sites, so snapshots and logs list more mutants."
fixture = "tests/upstream_fixes.rs (project built inline: src/demo/ops2.py and src/demo/ops3.py)"
test = "tests/upstream_fixes.rs::mu_23_ac15_scan_lists_a_site_for_each_operator_of_issue_10"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "python-clause-coverage-line"
requirement = "MU-24"
description = """The original gives a Python site in an `elif` condition, an `except` clause, or a
`case` guard the first line of the enclosing `if`, `try`, or `match` statement as its coverage line.
That line is covered, so a mutant on an uncovered clause runs and is reported as SURVIVED (upstream
issue 9). The port uses the first line of the clause, so such a site is an uncovered site."""
changed_behavior = "A Python site in an uncovered `elif`, `except`, or `case` clause is an uncovered site and runs no mutant."
fixture = "tests/upstream_fixes.rs (project built inline: src/demo/branches.py and src/demo/clauses.py)"
test = "tests/upstream_fixes.rs::mu_24_ac16_elif_sites_on_an_uncovered_line_are_uncovered"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "max-memory-limit"
requirement = "MU-25"
description = """The original has no memory limit and no `--max-memory-mb` flag. A mutant that makes
the tests allocate without end can use all memory of the host before the timeout ends it. The port
sums the resident memory of the process group of each mutant test run at least once each second.
Over the limit (default 4096 MiB, `--max-memory-mb N`, 0 turns it off) it kills the group with
SIGKILL, and the mutant counts as killed without a MU-21 second run. The baseline run in the project root has no limit."""
changed_behavior = "A mutant test run over the memory limit is killed, and the flag --max-memory-mb exists (the original exits 1 on it)."
fixture = "tests/memory_limit.rs (project built inline: src/m.py and an allocating test command)"
test = "tests/memory_limit.rs::mu_25_ac17_a_mutant_over_the_memory_limit_is_killed_once_and_fast"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "rust-test-code-by-attribute"
requirement = "MU-26"
description = """The original leaves out a Rust function only when an enclosing `mod` is named
`tests`. A `#[cfg(test)] mod unit_tests`, a function with `#[test]`, and a function with
`#[cfg(test)]` are then mutated as production code. The port also leaves out a function when an
enclosing `mod` has `#[cfg(test)]`, or when the function itself has `#[test]` or `#[cfg(test)]`.
It does not match `cfg(all(test, ...))`, `cfg(not(test))`, or `tokio::test`."""
changed_behavior = "A Rust function in a #[cfg(test)] module, or with #[test] or #[cfg(test)], has no sites and no snapshot entry."
fixture = "tests/rust_test_code.rs (project built inline: src/lib.rs with a production fn, a #[cfg(test)] mod unit_tests, a #[test] fn, and a #[cfg(test)] fn)"
test = "tests/rust_test_code.rs::mu_26_ac18_scan_lists_sites_for_production_rust_only"
changes_snapshot_keys_or_shape = false
approved = true

[[fix]]
id = "worker-baseline"
requirement = "MU-27"
description = """The original runs the baseline test command in the project root only. A command that
fails in every worker then kills every mutant, and the run reports no baseline failure. The port runs
the unmutated test command once in each worker directory of a file, all workers at the same time,
before the mutants of that file run. A failure gives exit code 2 and a message that names the lowest
failing worker, and it writes no snapshot."""
changed_behavior = "Before the mutants of a file run, a command that fails in a worker directory gives exit code 2 and a baseline failure message, and no snapshot changes."
fixture = "tests/mu27_worker_baseline.rs"
test = "tests/mu27_worker_baseline.rs::mu_27_ac_21_a_command_that_fails_only_in_a_worker_gives_exit_2"
changes_snapshot_keys_or_shape = false
approved = false

[[fix]]
id = "worker-output-directories"
requirement = "MU-28"
description = """The original links the directories `test-results` and `playwright-report` into each worker. A test command that writes Playwright output then writes into the project, and two workers share one output directory. The port does not link these two names at the project root or in the directory where the test command runs."""
changed_behavior = "A worker does not link the directories test-results and playwright-report at the project root or in the directory where the test command runs. The output of a test command goes to the worker directory, not to the project."
fixture = "tests/mu28_output_dirs.rs"
test = "tests/mu28_output_dirs.rs::mu_28_ac_22_a_worker_does_not_write_test_results_into_the_project"
changes_snapshot_keys_or_shape = false
approved = false

[[fix]]
id = "worker-html-copies"
requirement = "MU-29"
description = """The original links every entry of the project into each worker, including the HTML files. A bundler resolves a linked HTML entry file to its real path, which lies outside the worker, and the build fails. The port copies each `.html` file of the project into each worker, and the parent directories of such a file become real directories in the worker."""
changed_behavior = "A worker holds a real copy of each .html file of the project. The parent directories of such a file are real directories in the worker, and the other entries of those directories stay links."
fixture = "tests/mu29_html_copies.rs"
test = "tests/mu29_html_copies.rs::mu_29_ac_23_a_worker_holds_real_copies_of_html_files"
changes_snapshot_keys_or_shape = false
approved = false

[[fix]]
id = "worker-config-module-copies"
requirement = "MU-30"
description = """The original links every entry of the project into each worker, including the JavaScript and
TypeScript files at the project root. A build tool loads a linked configuration file from its real path. A
configuration that builds its entry paths from its own location then points into the project, and the build
fails. A helper that the configuration imports can build paths from its own location too. The port copies each
JavaScript and TypeScript file that lies directly in the project root, and each such file in the directory where
the test command runs when that directory is inside the worker. It also copies each file that these files import
through a relative import, directly or through other files. A file that is reached through a package name or an
alias is not copied."""
changed_behavior = "A worker holds a real copy of each JavaScript and TypeScript file that lies directly in the project root, and of each such file in the command directory when that directory is inside the worker. It also holds a real copy of each file that these files import through a relative import, directly or through other files. A link in the project stays a link. A file reached through a package name or an alias is not copied."
fixture = "tests/mu30_config_copies.rs"
test = "tests/mu30_config_copies.rs::mu_30_ac_24_a_worker_holds_real_copies_of_root_config_modules"
changes_snapshot_keys_or_shape = false
approved = false

