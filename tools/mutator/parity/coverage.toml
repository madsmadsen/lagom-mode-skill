setup = [
  { mutator = ["--no-coverage", "--test-command", "sh check.sh"] },
  'sed -i.bak "s/return self.cells == 64/return self.cells == 63/" src/demo/board.py && rm -f src/demo/board.py.bak',
]
args = ["--since-last-run", "--no-coverage", "--test-command", "sh check.sh"]
covers = ["--since-last-run", "MU-19"]

[[run]]
