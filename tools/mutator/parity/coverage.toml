# ---------- exit 2 and exit 3 ----------

[[run]]
name = "exit-2-baseline-fails"
fixture = "fixtures/python"
setup = [{ mutator = ["--no-coverage", "--test-command", "sh check.sh"] }]
args = ["--no-coverage", "--test-command", "false"]
expect_exit = 2
covers = ["exit 2", "MU-14"]

[[run]]
name = "exit-3-survivor-changed-backup"
fixture = "fixtures/python"
setup = [
  'mkdir -p target/mutator-backup/src/demo && cp src/demo/board.py target/mutator-backup/src/demo/board.py',
  'sed -i.bak "s/return self.cells == 64/return self.cells == 63/" src/demo/board.py && rm -f src/demo/board.py.bak',
]
args = ["--no-coverage", "--test-command", "sh check.sh"]
expect_exit = 3
covers = ["exit 3", "MU-18", "AC-6"]

