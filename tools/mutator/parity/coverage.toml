# Parity runs for run.py. Each [[run]] executes in a fresh copy of its fixture,
# once with the original and once with the port. Fields:
#   name         unique id, shown in the output
#   fixture      directory under mutator/parity/, relative to it
#   setup        optional; strings run with `sh -c` in the tree, and
#                { mutator = [...] } runs the side's tool with those args
#   args         arguments for the tool, after setup
#   expect_exit  optional; both sides must exit with this code
#   fix          optional. A fixes.toml id, or a list of ids, that explains the
#                difference this run shows. The run prints DIFF-ALLOWED for a
#                FAIL only when Mads Madsen approved every id, and only for a
#                stdout or snapshot difference (AC-1, MU-PB-6).
#   covers       the flags, the rule rows of README.md as `<language>: <rule>`, PRD ids
#                (MU-*, AC-*), and exit codes this run exercises. Only the values of the
#                form `<language>: <rule>` name a rule row.
#
# Mutating runs get `--max-workers 2` unless args has -h/--help/--scan/--max-workers,
# or expect_exit is 1 (usage errors).

# ---------- flags (AC-1) ----------

[[run]]
name = "flag-help-short"
fixture = "fixtures/python"
args = ["-h"]
expect_exit = 0
fix = ["worker-cap-half-the-cores", "max-memory-limit"]
# Fix worker-cap-half-the-cores (parity/fixes.toml): worker_count and cap_for in src/workers.rs cap workers at half the cores, as tests/worker_cap.rs checks, so the help text differs from the original on purpose. Fix max-memory-limit adds the --max-memory-mb lines.
covers = ["-h", "exit 0"]

[[run]]
name = "flag-help-long"
fixture = "fixtures/python"
args = ["--help"]
expect_exit = 0
fix = ["worker-cap-half-the-cores", "max-memory-limit"]
# Fix worker-cap-half-the-cores (parity/fixes.toml): worker_count and cap_for in src/workers.rs cap workers at half the cores, as tests/worker_cap.rs checks, so the help text differs from the original on purpose. Fix max-memory-limit adds the --max-memory-mb lines.
covers = ["--help", "exit 0"]

[[run]]
name = "flag-root"
fixture = "fixtures/python"
args = ["--root", ".", "--no-coverage", "--test-command", "sh check.sh"]
covers = ["--root", "--no-coverage", "--test-command"]

[[run]]
name = "flag-source-root-short"
fixture = "fixtures/python"
args = ["-s", "src", "--no-coverage", "--test-command", "sh check.sh"]
covers = ["-s"]

[[run]]
name = "flag-source-root-long"
fixture = "fixtures/python"
args = ["--source-root", "src", "--no-coverage", "--test-command", "sh check.sh"]
covers = ["--source-root"]

[[run]]
name = "flag-changed"
fixture = "fixtures/python"
setup = [
  'echo "# edited" >> src/demo/board.py',
  'printf "x = 1\n" > src/demo/extra.py && git add src/demo/extra.py',
  'printf "y = 2\n" > src/demo/untracked.py',
]
args = ["--changed", "--no-coverage", "--test-command", "sh check.sh"]
covers = ["--changed", "MU-7"]

[[run]]
name = "flag-scan"
fixture = "fixtures/python"
args = ["--scan", "--no-coverage"]
expect_exit = 0
covers = ["--scan", "exit 0"]

[[run]]
