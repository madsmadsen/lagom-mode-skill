args = ["--use-existing-coverage"]
setup = ['printf "mode: set\nexample.com/gofixture/calc/calc.go:+3.25,4.19 1_0 +1\nexample.com/gofixture/calc/calc.go:6.23,7.10 +1 0\nexample.com/gofixture/calc/calc.go:12.25,15.10 2_0 1\n" > target/coverage/go/coverage.out']
requires = []
covers = ["lenient:go-ints"]
expect_exit = 0

