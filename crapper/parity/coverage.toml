# Crash runs (AC-26): the original stops with a traceback and exit 1; the port must exit 1 too.
[[run]]
id = "crash-broken-symlink"
fixture = "crash"
args = ["--no-coverage"]
setup = ["ln -s /nonexistent/missing.py src/broken.py"]
requires = []
covers = ["crash:broken-symlink"]
expect_exit = 1

