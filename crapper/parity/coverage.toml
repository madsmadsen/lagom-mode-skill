# Parity runs for the Rust port. Every required item below is covered by at least one run.
# Each run executes the ORIGINAL Python crapper (see record_original.py).

[required]
items = ["flag:-h", "flag:--help", "flag:--root", "flag:-s", "flag:--source-root", "flag:--changed", "flag:--no-coverage",
         "flag:--use-existing-coverage", "flag:--coverage-command", "flag:--threshold", "arg:path", "arg:filter",
         "cr8:clojure","cr8:java","cr8:go","cr8:typescript","cr8:rust","cr8:python",
         "cr11:clojure","cr11:java","cr11:go","cr11:typescript","cr11:rust","cr11:python",
         "cr13:clojure","cr13:java","cr13:go","cr13:typescript","cr13:rust","cr13:python",
         "reject:unknown-flag","reject:missing-value","reject:bad-threshold","reject:no-coverage+coverage-command",
         "cr6:skip-dirs","cr7:changed","cr10:no-data",
         "crash:broken-symlink","crash:unreadable-source","crash:symlink-loop"]

# Existing-report runs: read the fixture's checked-in coverage reports only.
[[run]]
id = "python-existing"
fixture = "python"
args = ["--use-existing-coverage"]
setup = []
requires = []
covers = ["language:python", "flag:--use-existing-coverage", "cr8:python", "cr11:python"]
expect_exit = 0

