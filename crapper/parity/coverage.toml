# Changed files (CR-7): git repo with committed, modified, staged and untracked files.
[[run]]
id = "changed"
fixture = "changed"
args = ["--changed", "--no-coverage"]
setup = [
  "git init -q",
  "git -c user.name=parity -c user.email=parity@example.invalid add src/unchanged.py src/modified.py src/staged.py",
  "git -c user.name=parity -c user.email=parity@example.invalid commit -qm base",
  "printf 'def extra(x):\\n    if x:\\n        return 2\\n    return 3\\n' >> src/modified.py",
  "printf 'def staged_extra(x):\\n    if x:\\n        return 2\\n    return 3\\n' >> src/staged.py",
  "git add src/staged.py",
]
requires = ["git"]
covers = ["flag:--changed", "cr7:changed", "flag:--no-coverage"]
expect_exit = 0

