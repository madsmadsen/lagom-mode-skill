[package]
name = "crapper"
version = "0.1.0"
edition = "2021"
description = "CRAP scores for Clojure, Java, Go, TypeScript, Rust, and Python (Rust port of unclebob/crapper)."
license = "MIT"
publish = false

[lib]
name = "crapper"
path = "src/lib.rs"

[[bin]]
name = "crapper"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
roxmltree = "0.20"
regex = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[profile.release]
opt-level = 3
